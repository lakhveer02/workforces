name: workforces
description: "WorkforceOS - Enterprise HRMS and Workforce Management System"
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & Architecture
  flutter_bloc: ^8.1.6           # Reactive state management with clear separation
  equatable: ^2.0.5              # Value equality for immutable objects

  # Navigation & Routing  
  go_router: ^13.2.4             # Declarative routing with deep linking support

  # Network & API Integration
  dio: ^5.4.3+1                  # HTTP client with interceptors and error handling
  json_annotation: ^4.9.0        # JSON serialization annotations

  # Local Storage & Persistence
  shared_preferences: ^2.2.3     # Simple key-value storage for settings
  flutter_secure_storage: ^11.2.0 # Secure storage for sensitive data (tokens) - Updated for compatibility
  hive: ^2.2.3                   # Fast NoSQL database for offline data
  hive_flutter: ^1.1.0           # Flutter integration for Hive

  # UI Components & Design System
  google_fonts: ^6.2.1           # Inter font family for professional typography
  flutter_svg: ^2.0.10+1         # SVG support for scalable icons
  cached_network_image: ^3.3.1   # Efficient image loading with caching

  # Date & Time Handling
  intl: ^0.19.0                  # Internationalization and date formatting

  # Utilities & Core Features
  uuid: ^4.4.0                   # Unique identifier generation
  logger: ^2.3.0                 # Structured logging for debugging

  # File & Media Management
  file_picker: ^13.1.0           # Cross-platform file selection - Latest version with API 36 support
  image_picker: ^1.1.2           # Camera and gallery image selection

  # Location Services (for attendance tracking)
  geolocator: ^11.0.0           # GPS location services
  permission_handler: ^11.3.1    # Runtime permission management

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Integration Testing
  integration_test:
    sdk: flutter
  
  # Code Generation Tools
  build_runner: ^2.4.9           # Build system for code generation
  json_serializable: ^6.8.0      # JSON serialization code generation
  
  # Testing & Mocking
  mocktail: ^1.0.3               # Modern mocking library for tests
  
  # Code Quality & Linting
  flutter_lints: ^4.0.0          # Official Flutter linting rules
  
  # App Branding & Assets
  flutter_launcher_icons: ^0.13.1  # Generate app icons for all platforms
  flutter_native_splash: ^2.4.0    # Generate native splash screens

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/
  
